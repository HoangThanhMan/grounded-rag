# Plain RAG. No retrieval floor, no guard. This is what we measure against.
# Retrieval itself (hybrid + rerank) is the same in every configuration, so
# the table isolates the floor and the guard.
name: baseline

retrieval:
  chunker: recursive        # recursive | structural
  hybrid: true              # dense + BM25
  top_k_dense: 20
  top_k_sparse: 20
  rerank_candidates: 20
  rerank_to: 5
  min_score: 0.0            # disabled

generation:
  temperature: 0.0
  max_tokens: 512
  require_citations: true

guard:
  enabled: false
