# Everything on. This is the configuration the README reports.
name: full

retrieval:
  chunker: structural       # split on Điều / Khoản boundaries
  hybrid: true
  top_k_dense: 20
  top_k_sparse: 20
  rerank_candidates: 20
  rerank_to: 5
  min_score: 0.30

generation:
  temperature: 0.0
  max_tokens: 512
  require_citations: true

guard:
  enabled: true
  entailment_threshold: 0.50   # calibrated on the dev split - scripts/calibrate_tau.py
  max_regenerations: 1
  on_unsupported: drop_claim   # drop_claim | abstain_all
