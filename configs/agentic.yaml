# Full + corrective retrieval. When the first retrieval is weak, one LLM call
# rewrites the question into legal terms or splits it into sub-questions, and
# retrieval runs again. What it buys (false abstention, retrieval recall on
# multi-part / colloquial questions) and what it costs (LLM calls, p95) is the
# row this configuration adds to the table. docs/adr/0005-corrective-retrieval-loop.md
name: agentic

retrieval:
  chunker: structural
  hybrid: true
  top_k_dense: 20
  top_k_sparse: 20
  rerank_candidates: 20
  rerank_to: 5
  min_score: 0.30

corrective:
  enabled: true
  confident_score: 0.60     # at or above: the first retrieval is kept as it is
  max_rounds: 1
  max_queries: 3

generation:
  temperature: 0.0
  max_tokens: 512
  require_citations: true

guard:
  enabled: true
  entailment_threshold: 0.50   # calibrated on the dev split - docs/06-guard-design.md
  max_regenerations: 1
  on_unsupported: drop_claim

max_llm_calls: 4            # plan 1 + answer 1 + regeneration 1, one spare
