name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.12 is what the Docker image runs (.python-version); the newest
        # release is what a fresh local venv tends to get.
        python-version: ["3.12"]
    env:
      LLM_PROVIDER: mock        # no API keys in CI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e "backend[dev]"

      - name: Lint
        run: ruff check backend/src backend/tests backend/alembic

      - name: Unit tests
        run: pytest -q backend/tests

