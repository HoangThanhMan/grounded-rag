name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: mock        # no API keys, no model weights in CI
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      # the versions the Docker image ships, not whatever is newest today
      - name: Install
        run: |
          pip install -r backend/requirements.lock --extra-index-url https://download.pytorch.org/whl/cpu
          pip install --no-deps -e backend
          pip install pytest pytest-asyncio ruff
      - name: Lint
        run: ruff check backend/src backend/tests backend/alembic eval
      - name: Tests (SQLite)
        run: pytest -q backend/tests
      # The schema built by the migrations, with the column limits SQLite ignores
      - name: Tests (Postgres)
        run: pytest -q backend/tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npx vite build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose file is valid
        run: docker compose config -q
