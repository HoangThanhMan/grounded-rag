name: eval-nightly

# The 240 test questions on the real corpus, real models and a real generator.
# Too slow and too costly for every push: the push workflow runs the mock
# smoke test, this one runs at night or by hand. Needs the GROQ_API_KEY secret.
on:
  # The schedule is off while eval-matrix.yml works through the v2 matrix: both
  # draw on one free-tier quota. Put it back once the matrix is in:
  #   schedule:
  #     - cron: "0 18 * * *"      # 01:00 in Asia/Ho_Chi_Minh
  workflow_dispatch:
    inputs:
      config:
        description: "configuration: baseline, threshold, full or agentic"
        default: full

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports: ["6333:6333"]
    env:
      QDRANT_URL: http://localhost:6333
      # the default provider is mock, which also mocks the embedder and the
      # store: indexing would go to a throwaway in-memory store, not Qdrant
      LLM_PROVIDER: openai
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CONFIG: ${{ github.event.inputs.config || 'full' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the API key
        id: key
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::notice::GROQ_API_KEY is not set; nothing to run"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.key.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache model weights
        if: steps.key.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('src/grounded_rag/config.py') }}

      - name: Install
        if: steps.key.outputs.skip != 'true'
        # the CUDA build of torch is ~3 GB of wheels this runner cannot use
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[models,dev]"

      - name: Index the corpus
        if: steps.key.outputs.skip != 'true'
        run: make ingest

      - name: Run, judge and tabulate
        if: steps.key.outputs.skip != 'true'
        run: python -m eval.matrix eval/matrix.nightly.yaml --only-config "$CONFIG"

      - uses: actions/upload-artifact@v4
        if: always() && steps.key.outputs.skip != 'true'
        with:
          name: eval-nightly-${{ env.CONFIG }}
          path: reports/runs/nightly/
