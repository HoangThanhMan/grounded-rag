# Nightly regression run (.github/workflows/eval-nightly.yml): one configuration,
# one run at temperature 0 so consecutive nights are comparable, on the 240
# test questions. The full matrix (eval/matrix.yaml) is run by hand.
dataset: eval/dataset/questions.jsonl
split: test
as_of: "2026-10-26"
temperature: 0.0
seeds: [1]
configs: [baseline, threshold, full, agentic]
out: reports/runs/nightly
retrieval_cache: .cache/retrieval

generators:
  - name: qwen3.8-27b
    provider: openai
    model: qwen/qwen3.8-27b
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    reasoning_effort: none

judge:
  model: openai/gpt-oss-120b
  base_url: https://api.groq.com/openai/v1
  api_key_env: GROQ_API_KEY
  reasoning_effort: low
