services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports: ["6333:6333"]
    volumes: ["./qdrant_storage:/qdrant/storage"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      retries: 5

  api:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      QDRANT_URL: http://qdrant:6333
      VLLM_BASE_URL: http://vllm:8000/v1   # used when LLM_PROVIDER=vllm
    volumes:
      - ./data:/app/data
      - ./.cache:/app/.cache          # HF model cache, survives rebuilds
    depends_on:
      qdrant: {condition: service_healthy}

  # Optional. Comment out if you do not need tracing yet.
  langfuse:
    image: langfuse/langfuse:2
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@langfuse-db:5432/postgres
      NEXTAUTH_SECRET: dev-secret-change-me
      SALT: dev-salt-change-me
      NEXTAUTH_URL: http://localhost:3000
    depends_on: [langfuse-db]

  langfuse-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    volumes: ["./langfuse_pgdata:/var/lib/postgresql/data"]

  # Optional, NVIDIA GPU only:  make up-gpu
  # An open model behind the OpenAI protocol, so switching to it is
  # LLM_PROVIDER=vllm + LLM_MODEL=Qwen/Qwen2.5-7B-Instruct-AWQ. AWQ weights are
  # already 4-bit - see docs/adr/0007-no-generator-fine-tuning.md.
  vllm:
    image: vllm/vllm-openai:v0.29.0
    profiles: ["gpu"]
    command:
      - --model=Qwen/Qwen2.5-7B-Instruct-AWQ
      - --max-model-len=8192
      - --gpu-memory-utilization=0.85
    ports: ["8001:8000"]
    ipc: host
    volumes: ["./.cache/hf:/root/.cache/huggingface"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
