# The built UI, and the API behind the same origin - so no CORS.
server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 11m;   # uploads: the API's own limit is 10 MB

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        # an answer streams token by token; buffering would hold it back
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location ~ ^/(healthz|readyz)$ {
        proxy_pass http://api:8000;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # client-side routes (/c/<id>, /documents) all load the app
    location / {
        try_files $uri /index.html;
    }
}
