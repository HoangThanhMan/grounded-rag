# The built UI, and the API behind the same origin - so no CORS.
# A template: ${REAL_IP_FROM} is filled in from the environment at start.
server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 11m;   # uploads: the API's own limit is 10 MB

    gzip on;
    # not text/event-stream: compressing an answer would hold its tokens back
    gzip_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/security-headers.conf;

    # Behind a TLS proxy, the client is the address that proxy saw: trusted
    # from REAL_IP_FROM only, or anyone could pick their own rate-limit bucket.
    set_real_ip_from ${REAL_IP_FROM};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Docker's DNS, looked up again every 10 s: a recreated api container
    # gets a new address, and a name resolved once at start would go stale.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        # the address nginx saw, not the client's own header: the API rate-limits on it
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        # an answer streams token by token; buffering would hold it back
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location ~ ^/(healthz|readyz)$ {
        proxy_pass $api;
    }

    # hashed file names: a new build is a new name
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # never cached, or a deploy would keep serving the old asset names
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # client-side routes (/c/<id>, /documents) all load the app
    location / {
        try_files $uri /index.html;
    }
}
