# The built UI, and the API behind the same origin - so no CORS.
server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 11m;   # uploads: the API's own limit is 10 MB

    gzip on;
    # not text/event-stream: compressing an answer would hold its tokens back
    gzip_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/security-headers.conf;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        # the address nginx saw, not the client's own header: the API rate-limits on it
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        # an answer streams token by token; buffering would hold it back
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location ~ ^/(healthz|readyz)$ {
        proxy_pass http://api:8000;
    }

    # hashed file names: a new build is a new name
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # never cached, or a deploy would keep serving the old asset names
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # client-side routes (/c/<id>, /documents) all load the app
    location / {
        try_files $uri /index.html;
    }
}
