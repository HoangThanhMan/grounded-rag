[project]
name = "grounded-rag"
version = "0.2.0"
description = "Vietnamese legal Q&A that cites the clause behind every answer."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "qdrant-client>=1.12",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# heavy - installed only when you actually run the models
models = [
    "sentence-transformers>=3.3",
    "transformers>=4.46",
    "torch>=2.5",
    "pymupdf>=1.24",
]
obs = ["prometheus-client>=0.21"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# the migrations directory is called alembic/ too
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# Vietnamese prose inside string literals: re-wrapping the prompt would change
# the prompt, and re-wrapping the legal fixture would change what it tests.
"src/grounded_rag/generation/prompts.py" = ["E501"]
"tests/test_chunkers.py" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
